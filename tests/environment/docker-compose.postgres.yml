services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rc_postgres_test
      POSTGRES_USER: rc_test
      POSTGRES_PASSWORD: rc_test_password
    # No host port or production volume: this database is integration-only.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc_test -d rc_postgres_test"]
      interval: 2s
      timeout: 5s
      retries: 30
